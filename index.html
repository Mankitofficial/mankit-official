<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050505">
<meta name="description" content="Mankit Office Life — Academics, Ideas, Connect & Personal Digital Office">

<title>Mankit | Office Life</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
    --bg:#050505;
    --bg2:#0a0a0a;
    --card:#101010;
    --card2:#141414;
    --border:rgba(255,255,255,.10);
    --border2:rgba(255,255,255,.06);

    --text:#f5f5f5;
    --muted:#999;
    --muted2:#666;

    --white:#ffffff;
    --gold:#d8b46a;

    --radius:24px;
    --max:1250px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
    overflow-x:hidden;
}

/* subtle background */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(circle at 20% 10%,rgba(255,255,255,.035),transparent 30%),
        radial-gradient(circle at 80% 70%,rgba(255,255,255,.025),transparent 35%);

    z-index:-1;
}

/* =========================================================
   INTRO SCREEN
========================================================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;

    background:
        radial-gradient(circle at center, #171717 0%, #080808 42%, #020202 100%);

    display:flex;
    align-items:center;
    justify-content:center;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

#intro.hide{
    opacity:0;
    visibility:hidden;
}

.intro-container{
    width:min(900px,90%);
    text-align:center;

    animation:introAppear 1.4s ease forwards;
}

.intro-small{
    font-size:11px;
    letter-spacing:5px;
    text-transform:uppercase;
    color:#777;
    margin-bottom:22px;
}

.intro-name{
    font-family:"Playfair Display",serif;
    font-size:clamp(65px,13vw,145px);
    line-height:.9;
    letter-spacing:-5px;
    font-weight:600;
}

.intro-spelling{
    margin-top:20px;
    font-size:12px;
    letter-spacing:9px;
    color:#777;
}

.intro-line{
    width:70px;
    height:1px;
    background:#555;
    margin:35px auto;
}

.intro-info{
    font-size:15px;
    color:#b8b8b8;
    line-height:2;
}

.intro-info strong{
    color:#fff;
    font-weight:600;
}

.intro-quote{
    margin:32px auto 0;
    max-width:650px;

    font-family:"Playfair Display",serif;
    font-size:clamp(18px,3vw,27px);
    line-height:1.5;

    color:#e7e7e7;
}

.intro-quote span{
    display:block;
    margin-top:12px;

    font-family:Inter,sans-serif;
    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#666;
}

.intro-loader{
    width:180px;
    height:2px;
    background:#202020;
    margin:40px auto 0;
    overflow:hidden;
}

.intro-loader::after{
    content:"";
    display:block;
    width:0%;
    height:100%;
    background:#fff;

    animation:loader 5s linear forwards;
}

@keyframes loader{
    to{
        width:100%;
    }
}

@keyframes introAppear{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   MAIN SITE
========================================================= */

#mainSite{
    opacity:0;
    transform:translateY(20px);
    transition:1s ease;
}

#mainSite.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================================================
   HEADER
========================================================= */

header{
    position:fixed;
    top:0;
    left:0;
    right:0;

    z-index:1000;

    background:rgba(5,5,5,.78);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border-bottom:1px solid var(--border2);
}

.navbar{
    width:min(var(--max),92%);
    height:76px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;

    text-decoration:none;
    color:#fff;
}

.logo-mark{
    width:38px;
    height:38px;

    border:1px solid #444;
    border-radius:50%;

    display:grid;
    place-items:center;

    font-family:"Playfair Display",serif;
    font-weight:bold;
}

.logo-text{
    font-size:14px;
    font-weight:700;
    letter-spacing:1px;
}

.logo-sub{
    display:block;
    color:#666;
    font-size:8px;
    letter-spacing:2px;
    margin-top:2px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:30px;
}

.nav-links a{
    color:#999;
    text-decoration:none;
    font-size:12px;
    transition:.3s;
}

.nav-links a:hover{
    color:#fff;
}

.nav-actions{
    display:flex;
    gap:8px;
}

.nav-icon{
    width:38px;
    height:38px;

    border:1px solid var(--border);
    border-radius:12px;

    display:grid;
    place-items:center;

    color:#aaa;
    text-decoration:none;

    transition:.3s;
}

.nav-icon:hover{
    color:#fff;
    background:#171717;
    transform:translateY(-2px);
}

/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:100vh;

    display:flex;
    align-items:center;

    padding:
        140px 4% 100px;

    position:relative;
}

.hero::after{
    content:"";
    position:absolute;

    width:500px;
    height:500px;

    right:-250px;
    top:100px;

    border-radius:50%;

    background:rgba(255,255,255,.025);
    filter:blur(40px);

    pointer-events:none;
}

.hero-container{
    width:min(var(--max),100%);
    margin:auto;

    display:grid;
    grid-template-columns:1.3fr .7fr;
    gap:70px;

    align-items:center;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;

    color:#8c8c8c;

    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;

    margin-bottom:25px;
}

.eyebrow i{
    color:#fff;
}

.hero h1{
    font-family:"Playfair Display",serif;

    font-size:clamp(55px,8vw,105px);

    line-height:.92;
    letter-spacing:-4px;

    font-weight:500;
}

.hero h1 span{
    color:#777;
}

.hero-description{
    max-width:650px;

    margin-top:30px;

    color:#969696;
    font-size:15px;
    line-height:1.9;
}

.hero-quote{
    margin-top:40px;

    padding-left:20px;

    border-left:1px solid #555;

    color:#d5d5d5;

    font-family:"Playfair Display",serif;
    font-size:21px;
    line-height:1.5;
}

.hero-quote small{
    display:block;

    margin-top:10px;

    font-family:Inter,sans-serif;
    font-size:9px;
    letter-spacing:3px;
    color:#666;
}

/* Hero card */

.office-card{
    position:relative;

    padding:35px;

    border:1px solid var(--border);

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.06),
            rgba(255,255,255,.015)
        );

    box-shadow:
        0 30px 100px rgba(0,0,0,.45);

    overflow:hidden;
}

.office-card::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            135deg,
            transparent 45%,
            rgba(255,255,255,.05) 50%,
            transparent 55%
        );

    transform:translateX(-100%);
    animation:shine 7s infinite;
}

@keyframes shine{
    0%,70%{
        transform:translateX(-100%);
    }

    100%{
        transform:translateX(100%);
    }
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:50px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;

    font-size:9px;
    letter-spacing:2px;
    color:#888;
    text-transform:uppercase;
}

.status-dot{
    width:7px;
    height:7px;
    background:#eee;
    border-radius:50%;
    box-shadow:0 0 15px #fff;
}

.card-number{
    color:#444;
    font-size:11px;
}

.office-card h3{
    font-family:"Playfair Display",serif;
    font-size:32px;
    font-weight:500;
}

.office-card p{
    color:#777;
    font-size:12px;
    line-height:1.8;
    margin-top:10px;
}

.card-divider{
    height:1px;
    background:var(--border);
    margin:28px 0;
}

.card-row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:10px 0;
}

.card-row span:first-child{
    color:#666;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:2px;
}

.card-row span:last-child{
    color:#ddd;
    font-size:11px;
}

/* =========================================================
   SECTION
========================================================= */

section{
    width:min(var(--max),92%);
    margin:auto;
    padding:110px 0;
}

.section-header{
    display:flex;
    align-items:end;
    justify-content:space-between;

    margin-bottom:45px;
}

.section-number{
    color:#555;
    font-size:10px;
    letter-spacing:3px;
}

.section-title{
    font-family:"Playfair Display",serif;
    font-size:clamp(36px,5vw,65px);
    font-weight:500;
    letter-spacing:-2px;
}

.section-description{
    max-width:420px;
    color:#777;
    font-size:13px;
    line-height:1.8;
}

/* =========================================================
   CALLOUT GRID
========================================================= */

.callout-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.callout{
    position:relative;

    min-height:250px;

    padding:32px;

    border:1px solid var(--border);

    border-radius:var(--radius);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012)
        );

    transition:.45s ease;

    overflow:hidden;
}

.callout:hover{
    transform:translateY(-6px);
    border-color:rgba(255,255,255,.22);
    background:#111;
}

.callout::after{
    content:"";

    position:absolute;

    width:160px;
    height:160px;

    right:-70px;
    bottom:-80px;

    border:1px solid rgba(255,255,255,.05);
    border-radius:50%;
}

.callout-number{
    color:#555;
    font-size:11px;
    letter-spacing:3px;
}

.callout-icon{
    width:45px;
    height:45px;

    display:grid;
    place-items:center;

    border:1px solid var(--border);
    border-radius:14px;

    color:#ddd;

    margin:20px 0;
}

.callout h3{
    font-size:20px;
    font-weight:600;
}

.callout p{
    color:#777;
    font-size:12px;
    line-height:1.8;
    margin-top:10px;
}

.callout a{
    display:inline-flex;
    align-items:center;
    gap:8px;

    margin-top:22px;

    color:#fff;
    text-decoration:none;

    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
}

.callout a i{
    font-size:9px;
}

/* =========================================================
   ACADEMICS
========================================================= */

.academic-panel{
    display:grid;
    grid-template-columns:1fr 1fr;

    border:1px solid var(--border);
    border-radius:30px;

    overflow:hidden;
}

.academic-left{
    padding:55px;

    background:
        linear-gradient(
            145deg,
            #151515,
            #090909
        );
}

.academic-left h3{
    font-family:"Playfair Display",serif;
    font-size:42px;
    font-weight:500;
}

.academic-left p{
    color:#777;
    font-size:13px;
    line-height:1.9;
    margin-top:20px;
}

.primary-button{
    display:inline-flex;
    align-items:center;
    gap:12px;

    margin-top:30px;

    padding:14px 20px;

    border-radius:12px;

    background:#fff;
    color:#050505;

    text-decoration:none;

    font-size:11px;
    font-weight:700;
    letter-spacing:1px;

    transition:.3s;
}

.primary-button:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 30px rgba(255,255,255,.1);
}

.academic-right{
    padding:55px;

    border-left:1px solid var(--border);

    background:#0b0b0b;
}

.info-item{
    padding:22px 0;
    border-bottom:1px solid var(--border);
}

.info-item:last-child{
    border-bottom:0;
}

.info-item span{
    display:block;

    color:#555;
    font-size:9px;
    letter-spacing:2px;
    text-transform:uppercase;

    margin-bottom:7px;
}

.info-item strong{
    font-size:14px;
    font-weight:500;
}

/* =========================================================
   CONNECT
========================================================= */

.connect-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.connect-card{
    padding:35px;

    border:1px solid var(--border);
    border-radius:22px;

    background:#0c0c0c;
}

.connect-card h3{
    font-size:21px;
}

.connect-card p{
    color:#777;
    font-size:12px;
    line-height:1.8;
    margin-top:12px;
}

.email-list{
    margin-top:22px;
}

.email-list a{
    display:block;

    color:#ddd;
    text-decoration:none;

    padding:10px 0;

    font-size:12px;

    border-bottom:1px solid var(--border2);

    transition:.3s;
}

.email-list a:hover{
    color:#fff;
    padding-left:7px;
}

.social-links{
    display:flex;
    flex-wrap:wrap;
    gap:10px;

    margin-top:22px;
}

.social-links a{
    padding:11px 15px;

    border:1px solid var(--border);
    border-radius:12px;

    color:#aaa;
    text-decoration:none;

    font-size:10px;

    transition:.3s;
}

.social-links a:hover{
    color:#fff;
    background:#171717;
}

/* =========================================================
   RELEASES
========================================================= */

.release-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.release{
    padding:30px;

    border:1px solid var(--border);
    border-radius:22px;

    display:flex;
    justify-content:space-between;
    gap:20px;

    background:#0c0c0c;
}

.release-status{
    color:#777;
    font-size:9px;
    letter-spacing:2px;
    text-transform:uppercase;
}

.release h3{
    margin-top:12px;
    font-size:18px;
}

.release p{
    margin-top:7px;
    color:#666;
    font-size:11px;
}

.date{
    white-space:nowrap;

    font-family:"Playfair Display",serif;
    font-size:19px;

    color:#ddd;
}

/* =========================================================
   ABOUT
========================================================= */

.about{
    position:relative;
}

.about-panel{
    padding:60px;

    border:1px solid var(--border);
    border-radius:30px;

    background:
        radial-gradient(
            circle at top right,
            rgba(255,255,255,.07),
            transparent 35%
        ),
        #0a0a0a;
}

.about-panel h3{
    font-family:"Playfair Display",serif;
    font-size:clamp(40px,5vw,65px);
    font-weight:500;
}

.about-panel > p{
    max-width:750px;

    color:#777;
    line-height:1.9;
    font-size:13px;

    margin-top:20px;
}

.highlight-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:12px;

    margin-top:45px;
}

.highlight{
    padding:22px;

    border:1px solid var(--border);
    border-radius:17px;

    background:#101010;
}

.highlight i{
    color:#aaa;
    margin-bottom:20px;
}

.highlight h4{
    font-size:13px;
    line-height:1.5;
}

.highlight p{
    color:#666;
    font-size:10px;
    line-height:1.6;
    margin-top:8px;
}

/* =========================================================
   QUOTE SECTION
========================================================= */

.quote-section{
    text-align:center;

    padding:
        130px 20px
        150px;
}

.quote-mark{
    font-family:"Playfair Display",serif;
    font-size:80px;
    color:#333;
    line-height:.5;
}

.final-quote{
    max-width:850px;
    margin:30px auto;

    font-family:"Playfair Display",serif;
    font-size:clamp(27px,5vw,52px);
    line-height:1.25;
    letter-spacing:-1px;
}

.quote-author{
    color:#555;

    font-size:9px;
    letter-spacing:4px;
    text-transform:uppercase;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    border-top:1px solid var(--border);

    padding:35px 4%;
}

.footer-inner{
    width:min(var(--max),100%);
    margin:auto;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.footer-brand{
    color:#777;
    font-size:11px;
}

.footer-brand strong{
    color:#ddd;
}

.footer-right{
    color:#555;
    font-size:9px;
    letter-spacing:2px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){

    .nav-links{
        display:none;
    }

    .hero-container{
        grid-template-columns:1fr;
    }

    .hero{
        padding-top:130px;
    }

    .office-card{
        max-width:600px;
    }

    .academic-panel{
        grid-template-columns:1fr;
    }

    .academic-right{
        border-left:0;
        border-top:1px solid var(--border);
    }

    .highlight-list{
        grid-template-columns:1fr;
    }
}

@media(max-width:700px){

    .callout-grid,
    .connect-grid,
    .release-grid{
        grid-template-columns:1fr;
    }

    .section-header{
        display:block;
    }

    .section-description{
        margin-top:15px;
    }

    .hero h1{
        letter-spacing:-3px;
    }

    .academic-left,
    .academic-right,
    .about-panel{
        padding:30px;
    }

    .intro-spelling{
        letter-spacing:5px;
    }

    .intro-info{
        font-size:12px;
    }

    .final-quote{
        font-size:31px;
    }

    .footer-inner{
        flex-direction:column;
        align-items:flex-start;
    }
}

@media(max-width:430px){

    .navbar{
        height:68px;
    }

    .logo-sub{
        display:none;
    }

    .nav-actions{
        gap:5px;
    }

    .nav-icon{
        width:34px;
        height:34px;
        border-radius:10px;
    }

    .hero{
        padding-left:5%;
        padding-right:5%;
    }

    section{
        width:90%;
    }

    .callout{
        padding:26px;
    }

    .office-card{
        padding:25px;
    }
}

</style>
</head>


<body>

<!-- =========================================================
     INTRO
========================================================= -->

<div id="intro">

    <div class="intro-container">

        <div class="intro-small">
            Welcome to the Digital Office
        </div>

        <div class="intro-name">
            Mankit
        </div>

        <div class="intro-spelling">
            M A N K I T
        </div>

        <div class="intro-line"></div>

        <div class="intro-info">

            <strong>STICHÉ • PRERANA ALUMNUS • BATCH 3</strong>
            <br>

            Ministry of Education, India

            <br><br>

            <strong>Sakura Science Club Member</strong>
            <br>

            Japan

        </div>

        <div class="intro-quote">

            "Dream beyond the ordinary,
            then build beyond the expected."

            <span>
                Mankit Office Life
            </span>

        </div>

        <div class="intro-loader"></div>

    </div>

</div>


<!-- =========================================================
     MAIN WEBSITE
========================================================= -->

<div id="mainSite">


<!-- HEADER -->

<header>

<nav class="navbar">

    <a href="#home" class="logo">

        <div class="logo-mark">
            M
